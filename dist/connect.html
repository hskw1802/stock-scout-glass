<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>本人用接続設定 · Stock Scout</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script type="module" src="/connect.js"></script></head><body><div class="ambient ambient-a" aria-hidden="true"></div><div class="ambient ambient-b" aria-hidden="true"></div><header class="topbar"><div class="brand"><img src="/icon.svg" alt="" width="32" height="32">Stock Scout</div><span class="real-tag">本人用</span></header><main class="connect-shell"><section class="glass connect-card"><div class="eyebrow">CONNECTION</div><h1>実データの接続設定</h1><div id="connection-status" class="connection-status" role="status">接続状態を確認中</div><form id="connect-form" autocomplete="off"><label class="label" for="api-key">ZENITH Code APIキー</label><input class="live-input" id="api-key" type="password" autocomplete="off" spellcheck="false" autocapitalize="none" placeholder="発行したキーを入力" minlength="16" maxlength="256" required disabled><label class="connect-agreement"><input id="personal-only" type="checkbox" required disabled>自分のFreeプランのキーを使用し、データは本人だけで利用します</label><button id="connect-button" class="button primary full-width" type="submit" disabled>接続を確認して保存</button></form><a id="market-link" class="button primary full-width" href="/market" hidden>銘柄・移動平均を表示</a><button id="disconnect-button" class="button glass full-width" hidden>接続を解除</button><p id="connect-error" class="field-error" role="alert"></p><p class="form-note">接続確認に無料枠の1トークンを使います。有料プランへの変更・課金の操作は行いません。</p><div class="connect-details"><div class="info-row"><span>保存方法</span><strong>暗号化・HttpOnly Cookie</strong></div><div class="info-row"><span>有効期間</span><strong>2時間</strong></div><div class="info-row"><span>実データ表示・監視</span><strong>日足・移動平均</strong></div></div><p class="form-note">キーはサーバーで暗号化し、このブラウザのCookieに保持します。JavaScriptからは読み取れません。GitHub・公開ページ・アクセスログには保存しません。接続解除または期限切れ後に再入力が必要です。</p><div class="connect-links"><a href="https://zenithcode.net/pricing" target="_blank" rel="noopener noreferrer">無料登録・キー発行 ↗</a><a href="https://zenithcode.net/docs/display-rights" target="_blank" rel="noopener noreferrer">本人利用の条件 ↗</a></div></section></main></body></html>
