<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>銘柄・移動平均 · Stock Scout</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script type="module" src="/market.js"></script></head><body><div class="ambient ambient-a" aria-hidden="true"></div><div class="ambient ambient-b" aria-hidden="true"></div><header class="topbar"><div class="brand"><img src="/icon.svg" width="32" height="32" alt="">Stock Scout</div><a href="/connect" class="button glass">接続設定</a></header><main class="market-shell"><section class="glass market-card"><h1>銘柄・移動平均</h1><p class="form-note">ZENITH Code · 日足データ。市場全体を検索し、週次騰落率の上位100銘柄を取得します。全銘柄の移動平均を一括判定する機能ではありません。</p><div class="market-actions"><button class="button primary" id="load-market">市場から取得 · 10トークン</button><form id="symbol-form"><input class="live-input" id="symbol" placeholder="証券コード（例 7203）" aria-label="証券コード" pattern="[0-9][0-9A-Za-z]{3}" maxlength="4" required><button class="button glass">日足を取得 · 10トークン</button></form></div><p id="market-error" role="alert" class="field-error"></p><p id="market-status" role="status" class="form-note">接続を確認中</p><div id="market-results"></div></section><section id="history-panel" class="glass market-card" hidden><h2 id="history-title"></h2><p id="history-date" class="form-note"></p><div id="history-values" class="market-values"></div><svg id="price-chart" viewBox="0 0 920 330" role="img" aria-label="調整後終値と移動平均"></svg><p class="form-note">黒：調整後終値　青：5日　紫：25日　緑：75日。横軸は取引日、縦軸は円。</p><p id="history-signal" class="connection-status"></p><a class="button glass" href="https://www.sbisec.co.jp/" target="_blank" rel="noopener noreferrer">SBI証券を開く</a><p class="form-note">注文情報の自動入力はありません。注文画面で銘柄と価格を確認してください。</p></section><footer class="form-note">取得ごとに無料枠を消費します。自動更新・バックグラウンド監視・iPhone通知は未対応です。データはこの画面を閉じると消去されます。</footer></main><div id="market-loader" class="market-loader" hidden role="status" aria-label="データを読み込み中"><div class="glass"><div class="market-skeleton"></div><div class="market-skeleton"></div><div class="market-skeleton"></div><div class="market-skeleton"></div><p>取得中…</p></div></div></body></html>
